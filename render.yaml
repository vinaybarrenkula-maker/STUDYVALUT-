services:
  - type: web
    name: study-vault-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true # Render will automatically generate a secure random secret key
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: MONGO_URI
        sync: false # User will input their MongoDB Atlas URI in the Render dashboard
      - key: CLIENT_URL
        sync: false # User will input their Vercel frontend URL
      - key: GOOGLE_CLIENT_ID
        sync: false # Optional: Google Client ID
